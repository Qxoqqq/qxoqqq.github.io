<!DOCTYPE html>
<html>
    <head>
        <title>PalindromeX Test interface</title>
        <link rel="stylesheet" href="style.css">
        <script src=https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.14.0/pixi.min.js></script>
    </head>
    <body>
        <main class="calendarContainer">
            <div class="dateContainer">
                <div class="monthsRow"></div>
                <div class="daysRow"></div>
            </div>
            <div class="hoursContainer">
                <div class="hoursColumn"></div>
                <div class="hoursSpacer"></div>
            </div>
            <div class="calendar">
                <div class="dayColumns"></div>
                <canvas id="canvas" class="canvas"></canvas>
                <div id="infoPopup">
                    Task<br>
                    Dates:<br>
                    Work days:<br>
                    Hours:
                </div>
            </div>
        </main>
        <script src="app.js"></script>
    </body>
</html>
